<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>.</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body data-theme="light" data-theme-color="blue" data-tauri-drag-region>
    <div class="bubble" id="bubble-root" data-opacity="1.0" data-tauri-drag-region>
      <div class="bubble-header" data-tauri-drag-region>
        <span class="title" data-tauri-drag-region>GOLDPRICE</span>
        <div class="bubble-header-right" data-tauri-drag-region>
          <span class="status-dot offline" id="bubble-status-dot" data-tauri-drag-region></span>
        </div>
      </div>
      <div class="bubble-lines" id="bubble-lines" data-tauri-drag-region>
        <!-- Dynamically generated price lines -->
      </div>
    </div>
    <script type="module" src="/bubble-app.js"></script>
  </body>
</html>
